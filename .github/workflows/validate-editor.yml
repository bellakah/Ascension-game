name: Validate Ascension Editor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply object depth modes
        if: github.event.pull_request.head.ref == 'fix/object-depth-modes'
        run: |
          if [ -f scripts/apply_object_depth_modes.py ]; then
            python3 scripts/apply_object_depth_modes.py
          fi

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Push corrected object depth files
        if: github.event.pull_request.head.ref == 'fix/object-depth-modes'
        run: |
          if [ -f scripts/apply_object_depth_modes.py ]; then
            git rm scripts/apply_object_depth_modes.py
          fi
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/map/mapAssetPresets.ts src/editor/map/mapAssetConfigurator.ts src/map/publishedMapRuntime.ts src/game/runtime.ts
          git commit -m "fix(editor): add object depth modes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
