name: Validate Ascension Editor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply brush correction
        if: startsWith(github.event.pull_request.head.ref, 'fix/editor-brush-final')
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/editor/map/mapEditorProApp.ts')
          text = path.read_text(encoding='utf-8')

          if "type BrushShape = 'circle' | 'square';" not in text:
              text = text.replace("type SnapMode = 'grid' | 'half' | 'free';", "type SnapMode = 'grid' | 'half' | 'free';\ntype BrushShape = 'circle' | 'square';")
              text = text.replace("const SNAP_KEY = 'ascension.map-editor.snap.v1';", "const SNAP_KEY = 'ascension.map-editor.snap.v1';\nconst BRUSH_SHAPE_KEY = 'ascension.map-editor.brush-shape.v1';")
              text = text.replace("  let brushSize = 1;\n", "  let brushSize = 1;\n  let brushShape: BrushShape = (localStorage.getItem(BRUSH_SHAPE_KEY) as BrushShape) || 'circle';\n")
              text = text.replace(")) * .92, .2, 2.5);", ")) * .80, .2, 2.5);", 1)

              old = '''  const paintTerrain = (x: number, y: number, random = false) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) paintTerrainOne(x + ox, y + oy, random ? randomEntry() : entry);
  };
  const eraseTerrain = (x: number, y: number) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!validTile(x + ox, y + oy)) continue;
      const key = tileKey(x + ox, y + oy), value = mapDoc.tiles[key] ?? {};
      if (layer === 'detail') delete value.detail; else value.ground = 'grass';
      mapDoc.tiles[key] = value;
    }
  };'''
              new = '''  const brushContains = (ox: number, oy: number) => {
    if (brushShape === 'square' || brushSize <= 1) return true;
    const radius = Math.max(.75, (brushSize - 1) / 2 + .25);
    return Math.hypot(ox, oy) <= radius;
  };
  const paintTerrain = (x: number, y: number, random = false) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!brushContains(ox, oy)) continue;
      paintTerrainOne(x + ox, y + oy, random ? randomEntry() : entry);
    }
  };
  const eraseTerrain = (x: number, y: number) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!brushContains(ox, oy) || !validTile(x + ox, y + oy)) continue;
      const key = tileKey(x + ox, y + oy), value = mapDoc.tiles[key] ?? {};
      if (layer === 'detail') delete value.detail; else value.ground = 'grass';
      mapDoc.tiles[key] = value;
    }
  };'''
              if old not in text:
                  raise SystemExit('terrain paint block not found')
              text = text.replace(old, new, 1)

              marker = '''<div class="group"><label>Tamanho<select id="mep-brush-size"><option>1</option><option>3</option><option>5</option><option>7</option></select></label><label>Camada<select id="mep-terrain-layer">'''
              replacement = '''<div class="group"><label>Formato</label><button data-brush-shape="circle" class="${brushShape === 'circle' ? 'active' : ''}">Circular</button><button data-brush-shape="square" class="${brushShape === 'square' ? 'active' : ''}">Quadrado</button></div><div class="group"><label>Tamanho<select id="mep-brush-size"><option>1</option><option>3</option><option>5</option><option>7</option></select></label><label>Camada<select id="mep-terrain-layer">'''
              if marker not in text:
                  raise SystemExit('terrain toolbar block not found')
              text = text.replace(marker, replacement, 1)

              binding = "    const brush = contextBar.querySelector<HTMLSelectElement>('#mep-brush-size'); if (brush) { brush.value = String(brushSize); brush.onchange = () => { brushSize = Number(brush.value) || 1; }; }\n"
              text = text.replace(binding, binding + "    contextBar.querySelectorAll<HTMLButtonElement>('[data-brush-shape]').forEach((button) => button.onclick = () => { brushShape = button.dataset.brushShape === 'square' ? 'square' : 'circle'; localStorage.setItem(BRUSH_SHAPE_KEY, brushShape); renderContext(); render(); });\n", 1)

              old_preview = '''        const radius = Math.floor(brushSize / 2), start = { x: hoverTile.x - radius, y: hoverTile.y - radius };
        const hx = (start.x * mapDoc.tileSize - cameraX) * zoom, hy = (start.y * mapDoc.tileSize - cameraY) * zoom;
        ctx.fillStyle = 'rgba(133,219,255,.13)'; ctx.strokeStyle = '#8ddcff'; ctx.fillRect(hx, hy, tilePx * brushSize, tilePx * brushSize); ctx.strokeRect(hx, hy, tilePx * brushSize, tilePx * brushSize);'''
              new_preview = '''        const radius = Math.floor(brushSize / 2), start = { x: hoverTile.x - radius, y: hoverTile.y - radius };
        const hx = (start.x * mapDoc.tileSize - cameraX) * zoom, hy = (start.y * mapDoc.tileSize - cameraY) * zoom;
        ctx.fillStyle = 'rgba(133,219,255,.13)'; ctx.strokeStyle = '#8ddcff'; ctx.lineWidth = 1.5;
        if (brushShape === 'circle') {
          const diameter = tilePx * brushSize, cx = hx + diameter / 2, cy = hy + diameter / 2;
          ctx.beginPath(); ctx.arc(cx, cy, diameter / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillRect(hx, hy, tilePx * brushSize, tilePx * brushSize); ctx.strokeRect(hx, hy, tilePx * brushSize, tilePx * brushSize);
        }'''
              if old_preview not in text:
                  raise SystemExit('brush preview block not found')
              text = text.replace(old_preview, new_preview, 1)
              path.write_text(text, encoding='utf-8')

          pack = Path('src/editor/map/pixelCrawlerPack.ts')
          data = pack.read_text(encoding='utf-8')
          for key in ('pc_grass', 'pc_stone', 'pc_dirt', 'pc_water'):
              data = re.sub(rf'^\s*"{key}":.*\n', '', data, count=1, flags=re.MULTILINE)
          pack.write_text(data, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Push corrected files
        if: startsWith(github.event.pull_request.head.ref, 'fix/editor-brush-final')
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/map/mapEditorProApp.ts src/editor/map/pixelCrawlerPack.ts
          git commit -m "fix(editor): add circular and square terrain brushes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
