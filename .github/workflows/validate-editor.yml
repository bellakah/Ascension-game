name: Validate Ascension Editor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply requested brush correction
        if: startsWith(github.event.pull_request.head.ref, 'fix/editor-brush-direct')
        run: python3 scripts/apply_brush_patch.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Push corrected files
        if: startsWith(github.event.pull_request.head.ref, 'fix/editor-brush-direct')
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/map/mapEditorProApp.ts src/editor/map/pixelCrawlerPack.ts
          git commit -m "fix(editor): add circular and square terrain brushes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
