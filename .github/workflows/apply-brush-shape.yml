name: Apply brush shape correction

on:
  push:
    branches:
      - fix/editor-terrain-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-terrain-ux
          fetch-depth: 0

      - name: Apply brush and framing changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/editor/map/mapEditorProApp.ts')
          text = path.read_text(encoding='utf-8')

          text = text.replace("type SnapMode = 'grid' | 'half' | 'free';", "type SnapMode = 'grid' | 'half' | 'free';\ntype BrushShape = 'circle' | 'square';")
          text = text.replace("const SNAP_KEY = 'ascension.map-editor.snap.v1';", "const SNAP_KEY = 'ascension.map-editor.snap.v1';\nconst BRUSH_SHAPE_KEY = 'ascension.map-editor.brush-shape.v1';")
          text = text.replace("  let brushSize = 1;\n", "  let brushSize = 1;\n  let brushShape: BrushShape = (localStorage.getItem(BRUSH_SHAPE_KEY) as BrushShape) || 'circle';\n")
          text = text.replace(")) * .92, .2, 2.5);", ")) * .80, .2, 2.5);", 1)

          old = '''  const paintTerrain = (x: number, y: number, random = false) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) paintTerrainOne(x + ox, y + oy, random ? randomEntry() : entry);
  };
  const eraseTerrain = (x: number, y: number) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!validTile(x + ox, y + oy)) continue;
      const key = tileKey(x + ox, y + oy), value = mapDoc.tiles[key] ?? {};
      if (layer === 'detail') delete value.detail; else value.ground = 'grass';
      mapDoc.tiles[key] = value;
    }
  };'''
          new = '''  const brushContains = (ox: number, oy: number) => {
    if (brushShape === 'square' || brushSize <= 1) return true;
    const radius = Math.max(.75, (brushSize - 1) / 2 + .25);
    return Math.hypot(ox, oy) <= radius;
  };
  const paintTerrain = (x: number, y: number, random = false) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!brushContains(ox, oy)) continue;
      paintTerrainOne(x + ox, y + oy, random ? randomEntry() : entry);
    }
  };
  const eraseTerrain = (x: number, y: number) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!brushContains(ox, oy) || !validTile(x + ox, y + oy)) continue;
      const key = tileKey(x + ox, y + oy), value = mapDoc.tiles[key] ?? {};
      if (layer === 'detail') delete value.detail; else value.ground = 'grass';
      mapDoc.tiles[key] = value;
    }
  };'''
          if old not in text:
              raise SystemExit('paint terrain block not found')
          text = text.replace(old, new, 1)

          old_collision = '''  const paintCollision = (x: number, y: number, remove = false) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      const tx = x + ox, ty = y + oy; if (!validTile(tx, ty)) continue;
      const key = tileKey(tx, ty);
      if (remove) mapDoc.collision = mapDoc.collision.filter((value) => value !== key);
      else if (!mapDoc.collision.includes(key)) mapDoc.collision.push(key);
    }
  };'''
          new_collision = '''  const paintCollision = (x: number, y: number, remove = false) => {
    const radius = Math.floor(brushSize / 2);
    for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
      if (!brushContains(ox, oy)) continue;
      const tx = x + ox, ty = y + oy; if (!validTile(tx, ty)) continue;
      const key = tileKey(tx, ty);
      if (remove) mapDoc.collision = mapDoc.collision.filter((value) => value !== key);
      else if (!mapDoc.collision.includes(key)) mapDoc.collision.push(key);
    }
  };'''
          if old_collision in text:
              text = text.replace(old_collision, new_collision, 1)

          terrain_marker = '''<div class="group"><label>Tamanho<select id="mep-brush-size"><option>1</option><option>3</option><option>5</option><option>7</option></select></label><label>Camada<select id="mep-terrain-layer">'''
          terrain_repl = '''<div class="group"><label>Formato</label><button data-brush-shape="circle" class="${brushShape === 'circle' ? 'active' : ''}">Circular</button><button data-brush-shape="square" class="${brushShape === 'square' ? 'active' : ''}">Quadrado</button></div><div class="group"><label>Tamanho<select id="mep-brush-size"><option>1</option><option>3</option><option>5</option><option>7</option></select></label><label>Camada<select id="mep-terrain-layer">'''
          if terrain_marker not in text:
              raise SystemExit('terrain context marker not found')
          text = text.replace(terrain_marker, terrain_repl, 1)

          brush_binding = '''    const brush = contextBar.querySelector<HTMLSelectElement>('#mep-brush-size'); if (brush) { brush.value = String(brushSize); brush.onchange = () => { brushSize = Number(brush.value) || 1; }; }
'''
          brush_binding_new = brush_binding + '''    contextBar.querySelectorAll<HTMLButtonElement>('[data-brush-shape]').forEach((button) => button.onclick = () => { brushShape = button.dataset.brushShape === 'square' ? 'square' : 'circle'; localStorage.setItem(BRUSH_SHAPE_KEY, brushShape); renderContext(); render(); });
'''
          if brush_binding not in text:
              raise SystemExit('brush binding not found')
          text = text.replace(brush_binding, brush_binding_new, 1)

          old_preview = '''        const radius = Math.floor(brushSize / 2), start = { x: hoverTile.x - radius, y: hoverTile.y - radius };
        const hx = (start.x * mapDoc.tileSize - cameraX) * zoom, hy = (start.y * mapDoc.tileSize - cameraY) * zoom;
        ctx.fillStyle = 'rgba(133,219,255,.13)'; ctx.strokeStyle = '#8ddcff'; ctx.fillRect(hx, hy, tilePx * brushSize, tilePx * brushSize); ctx.strokeRect(hx, hy, tilePx * brushSize, tilePx * brushSize);'''
          new_preview = '''        const radius = Math.floor(brushSize / 2), start = { x: hoverTile.x - radius, y: hoverTile.y - radius };
        const hx = (start.x * mapDoc.tileSize - cameraX) * zoom, hy = (start.y * mapDoc.tileSize - cameraY) * zoom;
        ctx.fillStyle = 'rgba(133,219,255,.13)'; ctx.strokeStyle = '#8ddcff'; ctx.lineWidth = 1.5;
        if (brushShape === 'circle') {
          const diameter = tilePx * brushSize, cx = hx + diameter / 2, cy = hy + diameter / 2;
          ctx.beginPath(); ctx.arc(cx, cy, diameter / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillRect(hx, hy, tilePx * brushSize, tilePx * brushSize); ctx.strokeRect(hx, hy, tilePx * brushSize, tilePx * brushSize);
        }'''
          if old_preview not in text:
              raise SystemExit('brush preview not found')
          text = text.replace(old_preview, new_preview, 1)

          path.write_text(text, encoding='utf-8')

          pack = Path('src/editor/map/pixelCrawlerPack.ts')
          data = pack.read_text(encoding='utf-8')
          for key in ('pc_grass', 'pc_stone', 'pc_dirt', 'pc_water'):
              data, count = re.subn(rf'^\s*"{key}":.*\n', '', data, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'old terrain key {key} not found')
          pack.write_text(data, encoding='utf-8')
          PY

      - name: Verify build
        run: |
          npm install
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/map/mapEditorProApp.ts src/editor/map/pixelCrawlerPack.ts
          git commit -m "fix(editor): add circular and square terrain brushes"
          git push origin HEAD:fix/editor-terrain-ux
