name: Apply editor build fixes

on:
  push:
    branches:
      - feat/editor-rpgjs-workflow

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[editor-fixes]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/editor-rpgjs-workflow

      - name: Apply targeted corrections
        shell: python
        run: |
          from pathlib import Path

          app = Path('src/editor/map/mapEditorProApp.ts')
          text = app.read_text(encoding='utf-8')
          text = text.replace("import './mapEditorPro.css';\n", "import './mapEditorPro.css';\nimport './mapEditorProOverrides.css';\n", 1)
          old = """    if (layer === 'collision' || tool === 'collision') paintCollision(tile.x, tile.y, false);\n    else if (tool === 'eraser') {\n      if (layer === 'ground' || layer === 'detail') eraseTerrain(tile.x, tile.y);\n      else if (layer === 'collision') paintCollision(tile.x, tile.y, true);\n      else if (layer === 'objects') { const hit = objectAt(tile.x + .5, tile.y + .5); if (hit) mapDoc.objects = mapDoc.objects.filter((value) => value.id !== hit.id); }\n"""
          new = """    if (layer === 'collision' || tool === 'collision') paintCollision(tile.x, tile.y, tool === 'eraser');\n    else if (tool === 'eraser') {\n      if (layer === 'ground' || layer === 'detail') eraseTerrain(tile.x, tile.y);\n      else if (layer === 'objects') { const hit = objectAt(tile.x + .5, tile.y + .5); if (hit) mapDoc.objects = mapDoc.objects.filter((value) => value.id !== hit.id); }\n"""
          if old not in text:
              raise SystemExit('runPaint target not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          slicer = Path('src/editor/map/mapAutoSlicer.ts')
          text = slicer.read_text(encoding='utf-8')
          text = text.replace(", animation: undefined,\n        widthTiles:", ",\n        widthTiles:", 1)
          text = text.replace(", footprint: undefined, tags:", ", tags:", 1)
          slicer.write_text(text, encoding='utf-8')

          main = Path('src/main.ts')
          text = main.read_text(encoding='utf-8')
          old = """  void Promise.all([\n    import('./editor/map/mapEditorProOverrides.css'),\n    import('./editor/map/mapEditorProApp'),\n  ]).then(([, { startMapEditor }]) => startMapEditor());\n"""
          new = """  void import('./editor/map/mapEditorProApp').then(({ startMapEditor }) => startMapEditor());\n"""
          if old not in text:
              raise SystemExit('main target not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/editor/map/mapEditorProApp.ts src/editor/map/mapAutoSlicer.ts src/main.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(editor): correct validation findings [editor-fixes]"
          git push origin HEAD:feat/editor-rpgjs-workflow
