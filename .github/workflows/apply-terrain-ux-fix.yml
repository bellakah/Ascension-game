name: Apply terrain UX fix

on:
  push:
    branches:
      - fix/editor-terrain-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-terrain-ux
          fetch-depth: 0

      - name: Apply editor corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/editor/map/mapEditorProApp.ts')
          app = app_path.read_text(encoding='utf-8')

          old_fit = "zoom = clamp(Math.min(view.width / (mapDoc.width * mapDoc.tileSize), view.height / (mapDoc.height * mapDoc.tileSize)) * .92, .2, 2.5);"
          new_fit = "zoom = clamp(Math.min(view.width / (mapDoc.width * mapDoc.tileSize), view.height / (mapDoc.height * mapDoc.tileSize)) * .80, .2, 2.5);"
          if old_fit not in app:
              raise SystemExit('fitMap target not found')
          app = app.replace(old_fit, new_fit, 1)

          old_paint = '''  const paintTerrain = (x: number, y: number, random = false) => {
            const radius = Math.floor(brushSize / 2);
            for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) paintTerrainOne(x + ox, y + oy, random ? randomEntry() : entry);
          };
          const eraseTerrain = (x: number, y: number) => {
            const radius = Math.floor(brushSize / 2);
            for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
              if (!validTile(x + ox, y + oy)) continue;
              const key = tileKey(x + ox, y + oy), value = mapDoc.tiles[key] ?? {};
              if (layer === 'detail') delete value.detail; else value.ground = 'grass';
              mapDoc.tiles[key] = value;
            }
          };'''

          new_paint = '''  const brushContains = (ox: number, oy: number) => {
            if (brushSize <= 1) return ox === 0 && oy === 0;
            const radius = Math.max(1, brushSize / 2);
            return Math.hypot(ox, oy) <= radius;
          };
          const paintTerrain = (x: number, y: number, random = false) => {
            const radius = Math.floor(brushSize / 2);
            for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
              if (!brushContains(ox, oy)) continue;
              paintTerrainOne(x + ox, y + oy, random ? randomEntry() : entry);
            }
          };
          const eraseTerrain = (x: number, y: number) => {
            const radius = Math.floor(brushSize / 2);
            for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
              if (!brushContains(ox, oy) || !validTile(x + ox, y + oy)) continue;
              const key = tileKey(x + ox, y + oy), value = mapDoc.tiles[key] ?? {};
              if (layer === 'detail') delete value.detail; else value.ground = 'grass';
              mapDoc.tiles[key] = value;
            }
          };'''

          if old_paint not in app:
              raise SystemExit('terrain brush target not found')
          app = app.replace(old_paint, new_paint, 1)
          app_path.write_text(app, encoding='utf-8')

          pack_path = Path('src/editor/map/pixelCrawlerPack.ts')
          pack = pack_path.read_text(encoding='utf-8')
          for key in ('pc_grass', 'pc_stone', 'pc_dirt', 'pc_water'):
              pattern = rf'^\s*"{key}":.*\n'
              pack, count = re.subn(pattern, '', pack, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'old terrain asset {key} not found')
          pack_path.write_text(pack, encoding='utf-8')

          for redundant in (
              Path('public/assets/terrain/terrain-atlas.webp.b64'),
              Path('public/assets/terrain/sand-atlas.webp.b64'),
          ):
              if redundant.exists():
                  redundant.unlink()
          PY

      - name: Verify build
        run: |
          npm install
          npm run build

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): polish terrain brush and framing"
          git push origin HEAD:fix/editor-terrain-ux
